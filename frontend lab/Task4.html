
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Space Explorer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #0b102e;
            color: white;
        }
        .nav-link {
            color: white;
            transition: 0.3s;
        }
        .nav-link:hover {
            color: #b9a0ff;
        }
        .rocket {
            font-size: 100px;
            animation: fly 2s infinite alternate;
        }
        @keyframes fly {
            from { transform: translateY(20px); }
            to { transform: translateY(-20px); }
        }
        .btn:hover {
            transform: scale(1.1);
            transition: 0.3s;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">🚀 Space Explorer</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="#home">Home</a>
                <a class="nav-link" href="#about">About</a>
                <a class="nav-link" href="#contact">Contact</a>
            </div>
        </div>
    </nav>

    <section id="home" class="container text-center py-5">
        <div class="rocket">🚀</div>
        <h1>Explore the <span class="text-info">Universe</span></h1>
        <p>Discover planets, stars and galaxies!</p>
        <a href="#about" class="btn btn-primary">Explore Now</a>
    </section>

    <section id="about" class="container text-center py-4">
        <h2>Our Mission</h2>
        <p>Dream big and explore beyond the stars.</p>
    </section>

    <footer id="contact" class="text-center bg-dark p-3">
        Space Explorer © 2026
    </footer>
</body>
</html>
